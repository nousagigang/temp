name: Import Folder

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-folder:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Clone source repo
        run: git clone --depth 1 https://github.com/nousagigang/nousagigang.git source

      - name: Replace members folder
        run: |
          rm -rf assets/icons
          cp -R source/assets/icons ./assets/icons

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Import assets/icons folder from nousagigang/nousagigang"
            git push origin HEAD:main
          fi
